name: Versioncam

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # On a pull request: record every clip, and fail with a comment if one broke.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # to comment when a clip breaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the npm that reads this repository's lockfile, as in test-integration.yml
          cache: npm
      - run: npm ci
      # The frontend build and the PHP packages that a checkout needs to run.
      - run: npx grunt internal
      - run: docker run --rm -v "$PWD":/app -w /app composer:2 install --no-dev --no-interaction --ignore-platform-reqs
      # MySQL, and the official EspoCRM Apache image serving this checkout,
      # installed the way the image installs a release. The admin account is
      # the one versioncam.config.ts signs in with.
      - run: |
          docker network create espocrm
          docker run -d --name espocrm-db --network espocrm -e MYSQL_ROOT_PASSWORD=espocrm -e MYSQL_DATABASE=espocrm mysql:8.4
          docker run -d --name espocrm --network espocrm -p 8080:80 -v "$PWD":/var/www/html espocrm/espocrm:10.1.1-apache
          until docker exec espocrm-db mysqladmin ping -h 127.0.0.1 -uroot -pespocrm --silent; do sleep 2; done
          docker exec espocrm chown -R www-data:www-data data custom client/custom
          docker exec -u www-data espocrm sh -c '
            set -e
            bin/command config:populate
            bin/command config:set database.platform Mysql
            bin/command config:set database.host espocrm-db
            bin/command config:set database.dbname espocrm
            bin/command config:set database.user root
            bin/command config:set database.password espocrm
            bin/command rebuild
            bin/command create-admin-user admin
            printf "%s\n" demo-recording | bin/command set-password admin
            bin/command config:set siteUrl http://localhost:8080
            bin/command config:set isInstalled true --type=bool'
      - uses: versioncam/action@v1

  # On master: record every clip, then publish the recordings to version.cam.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub's token for version.cam, so no secret is stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the npm that reads this repository's lockfile, as in test-integration.yml
          cache: npm
      - run: npm ci
      # The frontend build and the PHP packages that a checkout needs to run.
      - run: npx grunt internal
      - run: docker run --rm -v "$PWD":/app -w /app composer:2 install --no-dev --no-interaction --ignore-platform-reqs
      # MySQL, and the official EspoCRM Apache image serving this checkout,
      # installed the way the image installs a release. The admin account is
      # the one versioncam.config.ts signs in with.
      - run: |
          docker network create espocrm
          docker run -d --name espocrm-db --network espocrm -e MYSQL_ROOT_PASSWORD=espocrm -e MYSQL_DATABASE=espocrm mysql:8.4
          docker run -d --name espocrm --network espocrm -p 8080:80 -v "$PWD":/var/www/html espocrm/espocrm:10.1.1-apache
          until docker exec espocrm-db mysqladmin ping -h 127.0.0.1 -uroot -pespocrm --silent; do sleep 2; done
          docker exec espocrm chown -R www-data:www-data data custom client/custom
          docker exec -u www-data espocrm sh -c '
            set -e
            bin/command config:populate
            bin/command config:set database.platform Mysql
            bin/command config:set database.host espocrm-db
            bin/command config:set database.dbname espocrm
            bin/command config:set database.user root
            bin/command config:set database.password espocrm
            bin/command rebuild
            bin/command create-admin-user admin
            printf "%s\n" demo-recording | bin/command set-password admin
            bin/command config:set siteUrl http://localhost:8080
            bin/command config:set isInstalled true --type=bool'
      - uses: versioncam/action@v1
      - uses: versioncam/action@v1
        if: ${{ !cancelled() }} # a clip that broke is published as broken
        with:
          mode: publish
